name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:55432/wig_platform_test?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Historical verifiers read frozen commits with git show <sha>:<path>.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Install PostgreSQL 18 host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update
          sudo apt-get install -y postgresql-18 postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Start task-owned PostgreSQL cluster
        run: |
          for tool in initdb pg_ctl postgres createdb psql; do
            command -v "$tool"
            "$tool" --version | grep -E 'PostgreSQL\) 18\.'
          done
          cluster_root=$(mktemp -d "$RUNNER_TEMP/mira-refund-pg.XXXXXX")
          cluster_root=$(cd "$cluster_root" && pwd -P)
          data_directory="$cluster_root/data"
          echo "MIRA_REFUND_AUTHORIZATION_TEST_CLUSTER=$data_directory" >> "$GITHUB_ENV"
          mkdir -m 700 "$cluster_root/socket"
          # Same disposable, loopback-only initdb/pg_ctl model as the readback test.
          initdb -D "$data_directory" -A trust -U postgres --no-locale --encoding=UTF8
          pg_ctl -D "$data_directory" -l "$cluster_root/postgres.log" \
            -o "-F -h 127.0.0.1 -p 55432 -k '$cluster_root/socket'" -w start
          createdb -h 127.0.0.1 -p 55432 -U postgres wig_platform_test
          # schema is a Prisma URL option, not a libpq connection parameter.
          psql_url="${DATABASE_URL%%\?*}"
          actual_directory=$(psql "$psql_url" -XAt -v ON_ERROR_STOP=1 -c 'SHOW data_directory')
          test "$actual_directory" = "$data_directory"
          test "$(psql "$psql_url" -XAt -v ON_ERROR_STOP=1 -c 'SELECT current_database()')" = wig_platform_test
          test "$(psql "$psql_url" -XAt -v ON_ERROR_STOP=1 -c 'SHOW server_encoding')" = UTF8

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Verify
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run verify -- -- --maxWorkers=2

      - name: Stop task-owned PostgreSQL cluster
        if: ${{ always() && env.MIRA_REFUND_AUTHORIZATION_TEST_CLUSTER != '' }}
        run: |
          data_directory="$MIRA_REFUND_AUTHORIZATION_TEST_CLUSTER"
          if [ -f "$data_directory/postmaster.pid" ]; then
            pg_ctl -D "$data_directory" -m fast -w stop
          fi
          rm -rf -- "$(dirname "$data_directory")"
